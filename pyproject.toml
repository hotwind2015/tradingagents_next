[project]
name = "tradingagents"
version = "0.1.0"
description = "Config-driven multi-agent investment analysis system (rebuild)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "omegaconf>=2.3",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "openai>=1.30.0",
    "yfinance>=0.2.40",
    "akshare>=1.12.0",
    "stockstats>=0.5.0",
]

[project.entry-points."tradingagents.llms"]
openai = "tradingagents.llm.openai_client:OpenAICompatibleClient"

[project.entry-points."tradingagents.providers"]
yfinance_kline = "tradingagents.providers.yfinance.kline:YFinanceKlineProvider"
yfinance_snapshot = "tradingagents.providers.yfinance.snapshot:YFinanceSnapshotProvider"
yfinance_news = "tradingagents.providers.yfinance.news:YFinanceNewsProvider"
yfinance_fundamentals = "tradingagents.providers.yfinance.fundamentals:YFinanceFundamentalsProvider"
fred_macro = "tradingagents.providers.fred.macro:FredMacroProvider"
stocktwits_social = "tradingagents.providers.stocktwits.social:StockTwitsSocialProvider"
reddit_social = "tradingagents.providers.reddit.social:RedditSocialProvider"
alpha_vantage_kline = "tradingagents.providers.alpha_vantage.kline:AlphaVantageKlineProvider"
alpha_vantage_news = "tradingagents.providers.alpha_vantage.news:AlphaVantageNewsProvider"
alpha_vantage_fundamentals = "tradingagents.providers.alpha_vantage.fundamentals:AlphaVantageFundamentalsProvider"
akshare_kline = "tradingagents.providers.akshare.kline:AKShareKlineProvider"
akshare_indicators = "tradingagents.providers.akshare.indicators:AKShareIndicatorsProvider"
akshare_fundamentals = "tradingagents.providers.akshare.fundamentals:AKShareFundamentalsProvider"
akshare_news = "tradingagents.providers.akshare.news:AKShareNewsProvider"
akshare_macro = "tradingagents.providers.akshare.macro:AKShareMacroProvider"
akshare_index = "tradingagents.providers.akshare.index:AKShareIndexProvider"

[project.entry-points."tradingagents.roles"]
market_analyst = "tradingagents.roles.market_analyst:MarketAnalyst"
project_manager = "tradingagents.roles.project_manager:ProjectManager"
fundamentals_analyst = "tradingagents.roles.fundamentals_analyst:FundamentalsAnalyst"
news_analyst = "tradingagents.roles.news_analyst:NewsAnalyst"
research_manager = "tradingagents.roles.research_manager:ResearchManager"
trader = "tradingagents.roles.trader:Trader"
risk_manager = "tradingagents.roles.risk_manager:RiskManager"
sentiment_analyst = "tradingagents.roles.sentiment_analyst:SentimentAnalyst"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tradingagents*"]

[project.scripts]
tradingagents = "tradingagents.cli:main"