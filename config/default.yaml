# 资源池：定义所有的角色细节
roles:
  market_analyst:
    plugin: market_analyst
    display_name_key: role.market
    consumes: [market_data]
    produces: [market_outlook]
    template: analysts/market.j2
    model_tier: quick
  fundamentals_analyst:
    plugin: fundamentals_analyst
    display_name_key: role.fundamentals
    consumes: [fundamentals_data]
    produces: [fundamental_score]
    template: analysts/fundamentals.j2
    model_tier: quick
  news_analyst:
    plugin: news_analyst
    display_name_key: role.news
    consumes: [news_data]
    produces: [news_impact]
    template: analysts/news.j2
    model_tier: quick
  bull_researcher:
    plugin: bull_researcher
    display_name_key: role.bull
    consumes: [market_data, fundamentals_data, news_data]
    produces: [researcher_thesis]
    template: analysts/bull.j2
    model_tier: deep
  bear_researcher:
    plugin: bear_researcher
    display_name_key: role.bear
    consumes: [market_data, fundamentals_data, news_data]
    produces: [researcher_thesis]
    template: analysts/bear.j2
    model_tier: deep
  project_manager:
    plugin: project_manager
    display_name_key: role.pm
    consumes: [market_outlook, fundamental_score, news_impact, researcher_thesis]
    produces: [final_report]
    template: project_manager.j2
    model_tier: deep

# 编排名单：默认跑满配
team:
  analysts: [market_analyst, fundamentals_analyst, news_analyst, bull_researcher, bear_researcher]
  project_manager: project_manager

# 数据源配置
data:
  required: [market_data, fundamentals_data, news_data]
  provider_chain:
    market_data: [yfinance]
    fundamentals_data: [yfinance]
    news_data: [yfinance]

models:
  provider: openai
  quick: {temperature: 0.1}
  deep: {temperature: 0.2}
logging:
  level: INFO
output:
  lang: zh-CN